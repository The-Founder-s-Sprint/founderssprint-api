<!-- Shared inline styles used across all templates -->
<!--
  USAGE: Copy the <style> block and wrapper into each template.
  Colour palette mirrors the landing page Art Deco system.
  Fonts: Josefin Sans (headings/labels), Cormorant Garamond (body)
  All corners sharp (no border-radius). Gold as primary accent.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap');
  body { margin:0; padding:0; background:#F5EED8; font-family: 'Cormorant Garamond', Georgia, serif; }
  .wrap { max-width:600px; margin:0 auto; background:#ffffff; }
  .header { background:#0B1810; padding:36px 40px 28px; text-align:center; }
  .header-eyebrow { font-family:'Josefin Sans',sans-serif; color:#C9A036; font-size:10px; letter-spacing:4px; text-transform:uppercase; font-weight:600; margin:0 0 10px; }
  .header-title { color:#ffffff; font-family:'Josefin Sans',sans-serif; font-size:22px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; margin:0; line-height:1.3; }
  .deco-line { display:flex; align-items:center; justify-content:center; gap:10px; margin:18px 0 0; }
  .deco-line span { display:block; height:1px; width:48px; background:#C9A036; }
  .deco-diamond { width:6px; height:6px; background:#C9A036; transform:rotate(45deg); }
  .body { padding:40px 40px; color:#3D3B35; font-size:16px; line-height:1.75; }
  .body p { margin:0 0 16px; }
  .highlight-box { background:#F5EED8; border-left:3px solid #C9A036; padding:16px 20px; margin:24px 0; }
  .highlight-box strong { color:#0B1810; }
  .table-clean { width:100%; border-collapse:collapse; margin:24px 0; font-size:15px; }
  .table-clean th { background:#0B1810; color:#C9A036; text-align:left; padding:12px 16px; font-family:'Josefin Sans',sans-serif; font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase; }
  .table-clean td { padding:12px 16px; border-bottom:1px solid rgba(201,160,54,0.2); vertical-align:top; font-size:15px; }
  .table-clean tr:last-child td { border-bottom:none; }
  .cta-btn { display:inline-block; background:#C9A036; color:#0B1810; font-family:'Josefin Sans',sans-serif; font-size:11px; font-weight:700; letter-spacing:3px; text-transform:uppercase; padding:15px 36px; text-decoration:none; }
  .footer { background:#0B1810; padding:28px 40px; text-align:center; }
  .footer p { font-family:'Josefin Sans',sans-serif; color:rgba(255,255,255,0.35); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; margin:4px 0; }
  .footer a { color:#C9A036; text-decoration:none; }
  .gold { color:#C9A036; }
  .divider { border:none; border-top:1px solid rgba(201,160,54,0.25); margin:28px 0; position:relative; }
  .divider::after { content:''; position:absolute; left:50%; top:-3px; width:6px; height:6px; background:#C9A036; transform:translateX(-50%) rotate(45deg); }
</style>
