name: Scheduled crons

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '0 2 * * *'
    - cron: '0 6 28 * *'
    - cron: '0 7 1 * *'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      BASE: https://api.founderssprint.co
    steps:
      - name: Hourly hold-sweep
        if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -fsS --retry 2 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$BASE/api/cron/hold-sweep"

      - name: Daily batch
        if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          for ep in reminders auto-move send-materials directory-lifecycle reconcile analytics-rollup; do
            echo "-> $ep"
            curl -fsS --retry 2 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$BASE/api/cron/$ep" || echo "WARN: $ep failed"
          done

      - name: Monthly reporting nudge
        if: github.event.schedule == '0 6 28 * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -fsS --retry 2 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$BASE/api/cron/monthly-nudge"

      - name: Monthly coach digest
        if: github.event.schedule == '0 7 1 * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -fsS --retry 2 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$BASE/api/cron/coach-digest"
